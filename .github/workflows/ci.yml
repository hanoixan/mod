# On every push and pull request: build, test and package; fuzz every parser; clang-tidy;
# the test suite under valgrind; and gigabyte files through the real editor.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: The release workflows' script
        run: tools/ci/release_test.sh

      - name: Install tools
        run: |
          if ! command -v g++-13 >/dev/null; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build rpm

      - name: Build, test and package
        run: tools/ci/package.sh

      - name: Smoke test (start, edit, save, quit in a pty)
        run: python3 tools/ci/smoke.py build/package/mod

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/
          retention-days: 7

  windows:
    # The MSYS2 runtime: the POSIX code as it is, mod.exe beside msys-2.0.dll.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      MSYS: winsymlinks:sys  # real symbolic links (dangling ones too) for the tests that make them
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc cmake ninja git python zip gdb

      - name: Build and package
        id: build
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
          tools/ci/package_windows.sh

      - name: Test
        run: ctest --preset windows-release

      - name: TEMPORARY - app_test under gdb, for a backtrace
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd build/windows-release/tests
          gdb -batch -ex run -ex bt -ex "info registers" --args ./app_test.exe -tc="Find opens with the last search*" 2>&1 | tail -60

      - name: Smoke test the packaged mod.exe in a Windows pseudo-console (start, edit, save, quit)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install --quiet pywinpty
          Expand-Archive dist/*.zip -DestinationPath smoke
          python tools/ci/smoke.py (Get-ChildItem smoke/*/bin/mod.exe).FullName

  macos:
    # Both architectures natively; the release joins them into one universal binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install llvm ninja

      - name: Build and test
        run: |
          llvm=$(brew --prefix llvm)
          cmake --preset macos-release -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" -DMOD_LIBCXX_PREFIX="$llvm"
          cmake --build --preset macos-release
          ctest --preset macos-release
          otool -L build/macos-release/mod

      - name: Smoke test (start, edit, save, quit in a pty)
        run: python3 tools/ci/smoke.py build/macos-release/mod

      - name: Install for the universal binary
        run: cmake --install build/macos-release --prefix "$PWD/stage-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: stage-macos-${{ matrix.arch }}
          path: stage-${{ matrix.arch }}/
          retention-days: 3

  macos-universal:
    # The release's universal binary: both builds joined with lipo, then smoke tested.
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: stage-macos-*
      - name: Join and package
        run: |
          tools/ci/package_macos.sh stage-macos-arm64 stage-macos-x86_64
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          python3 tools/ci/smoke.py "$(ls -d "$RUNNER_TEMP"/mod-*/bin/mod)"

  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/clang
      - name: Build the fuzzers
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMOD_BUILD_FUZZERS=ON -DMOD_BUILD_TESTS=OFF
          cmake --build build/fuzz
      - name: Fuzz each target for 60 s
        run: |
          mkdir -p crashes
          status=0
          for t in json config color_spec cli input utf8 lsp_frames regex markdown editor sidecar; do
            cp -r fuzz/corpus/$t work-$t
            maxlen=4096; [ $t = sidecar ] && maxlen=65536
            if ! build/fuzz/fuzz/fuzz_$t work-$t -max_total_time=60 -max_len=$maxlen -rss_limit_mb=2048 -timeout=10 \
                 -artifact_prefix=crashes/$t- -print_final_stats=1 > fuzz-$t.log 2>&1; then
              echo "::error::fuzz_$t found a crash"; tail -40 fuzz-$t.log; status=1
            fi
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  clang-tidy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/clang
      - name: Configure
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DMOD_BUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/tidy --target default_settings
      - name: clang-tidy (.clang-tidy; any finding fails)
        run: find src -name '*.cpp' -print0 | xargs -0 -P 4 -n 4 clang-tidy-19 -p build/tidy --quiet

  valgrind:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          if ! command -v g++-13 >/dev/null; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build valgrind
      - name: Build (optimized, with debug information)
        run: |
          cmake -S . -B build/valgrind -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPCRE2_SUPPORT_VALGRIND=ON
          cmake --build build/valgrind
      - name: Every test under memcheck
        run: tools/ci/valgrind.sh build/valgrind

  stress:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          if ! command -v g++-13 >/dev/null; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build
      - name: Build
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --target stress_test
      - name: 1 GB and 4 GB text and a 1 GB binary file through the editor (about 10 GB of disk)
        run: |
          df -h .
          ctest --preset linux-release-stress
