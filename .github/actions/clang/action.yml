name: clang toolchain
description: clang 19 (with libFuzzer and clang-tidy) over GCC 13's libstdc++, CMake and Ninja
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash /tmp/llvm.sh 19
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y clang-19 clang-tidy-19 libclang-rt-19-dev g++-13 libstdc++-13-dev ninja-build
